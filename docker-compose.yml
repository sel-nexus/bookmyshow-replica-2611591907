services:
  backend:
    build: ./backend
    environment:
      API_PORT: 3000
      SQLITE_PATH: /data/bookmyshow.db
      JWT_SECRET: dev-secret-change-in-production
      JWT_EXPIRES_IN: 30m
      CORS_ORIGIN: http://localhost:8080
    ports:
      - "3000:3000"
    volumes:
      - booking_data:/data
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
volumes:
  booking_data:
